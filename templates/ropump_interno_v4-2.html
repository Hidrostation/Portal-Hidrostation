<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RoPump – Configurador Interno v3</title>
<style>
/* ═══════════════════════════════════════════════
   ROPUMP — TEMA HIDROSTATION (claro / profissional)
   ═══════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#1a2b6b;--navy2:#253a8c;--teal:#00b5c8;--teal2:#00d0e8;
  --bg:#f4f6fa;--white:#ffffff;--card:#ffffff;--card2:#f0f3f8;
  --border:#d4dbe8;--muted:#6b7a99;--text:#2a3550;--dark:#1a2b6b;
  --acc:#00b5c8;--acc2:#00d0e8;--danger:#e0374a;--warn:#e88a00;
  --shadow:0 2px 8px rgba(26,43,107,.10);
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
.app{max-width:1100px;margin:0 auto;padding:10px}

/* ── HEADER ── */
.header{background:var(--navy);border-radius:10px 10px 0 0;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--teal)}
.logo{font-weight:900;font-size:24px;color:white;letter-spacing:-.5px}
.logo span{color:var(--teal)}
.header-sub{color:rgba(255,255,255,.55);font-size:11px;margin-top:2px}
.badge-int{padding:4px 10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:4px;font-size:10px;font-weight:800;color:white;letter-spacing:1.5px;text-transform:uppercase}

/* ── TAB NAV ── */
.tab-nav{display:flex;background:var(--navy2);border-bottom:1px solid rgba(255,255,255,.1);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:11px 16px;font-size:11px;font-weight:700;color:rgba(255,255,255,.55);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s}
.tab:hover{color:white}.tab.active{color:white;border-bottom-color:var(--teal);background:rgba(0,181,200,.1)}
.tab .num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.15);font-size:9px;margin-right:5px;color:rgba(255,255,255,.7)}
.tab.active .num{background:var(--teal);color:white}.tab.done .num{background:rgba(0,181,200,.4);color:white}

/* ── LAYOUT ── */
.main{display:grid;grid-template-columns:1fr 280px;background:var(--bg);min-height:500px}
.main.full{grid-template-columns:1fr}
.content{padding:22px;overflow-y:auto;max-height:82vh;background:var(--bg)}
.sidebar{padding:16px;background:var(--white);border-left:1px solid var(--border);overflow-y:auto;max-height:82vh;box-shadow:inset 2px 0 6px rgba(26,43,107,.04)}
.sec-title{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-sub{font-size:11px;color:var(--muted);margin:-6px 0 12px 0}

/* ── GRID ── */
.cgrid{display:grid;gap:10px}.cg2{grid-template-columns:1fr 1fr}.cg3{grid-template-columns:1fr 1fr 1fr}.cg4{grid-template-columns:1fr 1fr 1fr 1fr}

/* ── CARDS ── */
.crd{padding:12px;background:var(--white);border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;user-select:none;box-shadow:var(--shadow)}
.crd:hover{border-color:var(--teal)}.crd:active{transform:scale(.98)}
.crd.sel{border-color:var(--teal);background:#e8f9fb;box-shadow:0 0 0 3px rgba(0,181,200,.15)}
.crd-title{font-weight:800;font-size:15px;color:var(--navy)}.crd.sel .crd-title{color:var(--teal)}
.crd-sub{font-size:10px;color:var(--muted);margin-top:2px}
.spec{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--border)}
.spec span:first-child{color:var(--muted)}.spec span:last-child{font-weight:600;color:var(--dark)}

/* ── ACCESSORY ROWS ── */
.acc{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--white);border:1.5px solid var(--border);border-radius:7px;cursor:pointer;transition:all .15s;margin-bottom:6px;box-shadow:var(--shadow)}
.acc:hover{border-color:var(--teal);background:#f5fdfe}.acc.sel{border-color:var(--teal);background:#e8f9fb}
.acc-name{font-weight:600;font-size:11.5px;color:var(--text)}.acc.sel .acc-name{color:var(--navy)}
.acc-ref{font-size:9px;color:var(--muted);font-family:monospace;margin-top:1px}
.acc-price{font-size:11px;font-weight:700;color:var(--teal);margin-left:auto;white-space:nowrap}
.acc-check{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent}
.acc.sel .acc-check{background:var(--teal);border-color:var(--teal);color:white}
.acc-qty{display:flex;align-items:center;gap:4px}
.acc-qty button{width:22px;height:22px;border-radius:4px;border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.acc-qty button:hover{border-color:var(--teal);color:var(--teal)}
.acc-qty span{font-size:12px;font-weight:700;color:var(--navy);min-width:18px;text-align:center}

/* ── SIDEBAR ── */
.sb-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px}
.sb-item{display:flex;justify-content:space-between;font-size:10.5px;margin-bottom:3px}
.sb-item span:first-child{color:var(--muted)}.sb-item span:last-child{font-weight:600;color:var(--teal)}
.sb-divider{border:none;border-top:1px solid var(--border);margin:8px 0}
.sb-total{padding:10px;background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:6px;margin-top:8px}
.sb-total .lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.7)}
.sb-total .val{font-size:20px;font-weight:900;color:var(--teal)}

/* ── NAV BAR ── */
.nav{background:var(--white);border-top:1px solid var(--border);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 10px 10px;box-shadow:var(--shadow)}
.btn{padding:9px 20px;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;border:none;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-prev{background:var(--card2);color:var(--text);border:1.5px solid var(--border)}.btn-prev:disabled{opacity:.35;cursor:default}
.btn-next{background:var(--teal);color:white}.btn-next:disabled{background:var(--card2);color:var(--muted);cursor:default}
.btn-danger{background:var(--danger);color:white;font-size:11px;padding:7px 14px}
.copy-btn{padding:6px 14px;border-radius:5px;background:var(--teal);color:white;border:none;cursor:pointer;font-weight:700;font-size:11px;margin-top:6px}
.copy-btn:active{transform:scale(.97)}

/* ── FIELDS ── */
.field{margin-bottom:10px}
.field label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:block;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;padding:7px 10px;background:var(--white);border:1.5px solid var(--border);border-radius:5px;color:var(--text);font-size:12px;font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal)}

/* ── COST BOXES ── */
.cost-box{padding:14px;background:var(--white);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;box-shadow:var(--shadow)}
.cost-box h4{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.cost-row{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0}
.cost-row .k{color:var(--muted)}.cost-row .v{font-weight:600;color:var(--text)}
.cost-row.hl .v{color:var(--navy);font-weight:800;font-size:13px}
.cost-row.warn .v{color:var(--warn)}
.cost-tbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.cost-tbl th{background:var(--navy);color:white;padding:5px 7px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.5px}
.cost-tbl td{padding:5px 7px;border-bottom:1px solid var(--border);color:var(--text)}
.cost-tbl td.r{text-align:right;font-weight:600}.cost-tbl td.g{color:var(--teal)}
.cost-tbl tr.total td{font-weight:800;color:var(--navy);border-top:2px solid var(--teal);background:#e8f9fb}

/* ── PROPOSAL SECTIONS ── */
.prop-section{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.prop-section h3{font-size:11px;font-weight:800;color:var(--navy);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid var(--teal);padding-bottom:5px}
.prop-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.prop-spec{display:flex;justify-content:space-between;font-size:11px;padding:4px 8px;background:var(--card2);border-radius:4px}
.prop-spec .k{color:var(--muted)}.prop-spec .v{font-weight:700;color:var(--navy)}
.text-box{background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:14px;font-size:11px;line-height:1.7;color:var(--text);font-family:'Courier New',monospace;white-space:pre-wrap;word-break:break-word;max-height:350px;overflow-y:auto;user-select:all}

/* ── PUMP TABLE ── */
canvas{display:block;width:100%;border-radius:6px}
#print-header{display:none}#print-footer{display:none}
.pump-tbl{width:100%;border-collapse:collapse;font-size:10px;margin-top:6px}
.pump-tbl th{background:var(--navy);color:white;padding:4px 6px;text-align:center;font-size:9px}
.pump-tbl td{padding:3px 6px;border-bottom:1px solid var(--border);text-align:center;color:var(--text)}
.pump-tbl tr:nth-child(even){background:var(--card2)}

/* ── LABOR ── */
.labor-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:14px;box-shadow:var(--shadow)}
.labor-card h4{font-size:12px;font-weight:800;color:var(--navy);margin-bottom:2px}
.labor-card .rate{font-size:11px;color:var(--teal);font-weight:700;margin-bottom:8px}
.labor-card .subtotal{font-size:13px;font-weight:800;color:var(--navy);margin-top:6px;text-align:right}

/* ── SUGGESTION BANNER ── */
.suggest{padding:10px 14px;background:#fff8e6;border:2px solid #f0c040;border-radius:6px;margin-bottom:12px;font-size:11px;color:#8a5a00}
.suggest strong{color:var(--navy)}

/* ── N/A BUTTON ── */
.na-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--white);border:1.5px dashed var(--border);border-radius:6px;cursor:pointer;margin-bottom:6px;transition:all .15s;font-size:11px;color:var(--muted)}
.na-btn:hover{border-color:var(--danger);color:var(--danger)}
.na-btn.sel{border-color:var(--danger);border-style:solid;background:#fff0f0;color:var(--danger)}
.na-btn .na-check{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent}
.na-btn.sel .na-check{background:var(--danger);border-color:var(--danger);color:white}

@media(max-width:768px){.main{grid-template-columns:1fr}.sidebar{border-left:none;border-top:1px solid var(--border);max-height:none}.cg3,.cg2,.cg4{grid-template-columns:1fr}.prop-grid{grid-template-columns:1fr}}
@media print{
*{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box}
body{background:white!important;color:#1a1a2e!important;font-family:'Segoe UI',system-ui,sans-serif;font-size:9.5px!important;line-height:1.3!important}
.app{padding:0;max-width:none}
.tab-nav,.nav,.sidebar,.badge-int,.copy-btn,.btn,.header,canvas,.no-print{display:none!important}
.main{grid-template-columns:1fr!important;background:white!important}
.content{max-height:none!important;overflow:visible!important;padding:0!important;color:#1a1a2e!important}
#print-header{display:flex!important;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:2px solid #1a3a6b;margin-bottom:7px}
#print-header .ph-logo{font-size:14px;font-weight:900;color:#1a3a6b;line-height:1.1}
#print-header .ph-logo span{font-size:8.5px;font-weight:400;color:#5a6d88}
#print-header .ph-sub{font-size:8px;color:#5a6d88;margin-top:1px}
#print-header .ph-right{display:flex;align-items:center;gap:10px}
#print-header .ph-franklin img{height:22px!important;object-fit:contain}
#print-header .ph-contact{text-align:right;font-size:8px;color:#5a6d88;line-height:1.5;border-left:1px solid #c8d8ea;padding-left:8px}
#print-header .ph-contact strong{color:#1a3a6b}
#sections-row{display:grid!important;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:5px}
#row2{display:grid!important;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:5px}
.prop-section{border:1px solid #c8d8ea!important;background:white!important;border-radius:3px;margin-bottom:5px;padding:5px 6px!important}
.prop-section h3{color:#1a3a6b!important;font-size:8.5px!important;font-weight:700;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #c8d8ea;padding-bottom:2px;margin-bottom:3px}
.prop-grid{display:grid!important;grid-template-columns:1fr 1fr 1fr!important;gap:2px!important}
.prop-spec{background:#f2f6fb!important;border-radius:2px;padding:2px 4px!important}
.prop-spec .k{display:block;color:#6b7e96!important;font-size:7.5px!important;line-height:1.2}
.prop-spec .v{display:block;color:#1a1a2e!important;font-weight:700;font-size:9px!important;line-height:1.2}
.pump-tbl{font-size:7.5px!important;margin-top:3px}
.pump-tbl th{background:#1a3a6b!important;color:white!important;padding:1px 2px!important}
.pump-tbl td{padding:1px 2px!important;border-color:#dde6f0!important;color:#1a1a2e!important}
.fin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-bottom:4px}
.fin-cell{padding:3px 5px;background:#f2f6fb;border-radius:2px}
.fin-cell .fc-cat{font-size:6.5px;color:#6b7e96;text-transform:uppercase;display:block}
.fin-cell .fc-val{font-size:9px;font-weight:700;color:#1a3a6b;display:block}
.fin-cell .fc-sub{font-size:6px;color:#8a9ab0;display:block}
.fin-total-row{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:#1a3a6b;border-radius:3px}
.fin-total-row .ft-lbl{font-size:7px;color:rgba(255,255,255,.7)}
.fin-total-row .ft-detail{font-size:6.5px;color:rgba(255,255,255,.6)}
.fin-total-row .ft-val{font-size:14px;font-weight:900;color:#00d48a}
.text-box{font-size:7.5px!important;line-height:1.35!important;padding:4px 5px!important;max-height:none!important;background:#f8fafc!important;border:1px solid #dde6f0!important;color:#1a1a2e!important;white-space:pre-wrap;border-radius:2px;font-family:monospace!important}
#print-footer{display:block!important;margin-top:5px;padding-top:4px;border-top:1px solid #c8d8ea;font-size:7px;color:#8a9ab0;display:flex;justify-content:space-between}
#print-footer strong{color:#1a3a6b}
body.print-cliente .resumo-financeiro,body.print-cliente .no-client,body.print-cliente .prop-section.no-client,body.print-cliente .pump-tbl,body.print-cliente .text-box{display:none!important}
body.print-cliente #client-drawing{display:block!important}
body.print-cliente #row2{grid-template-columns:1fr auto!important}
#client-drawing{display:none}
@page{margin:7mm 8mm;size:A4}
}
</style>
</head>

<div class="app">
  <div class="header"><div><div class="logo">Hidro<span>Station</span> <span style="font-size:14px;color:rgba(255,255,255,.5);font-weight:400">— RoPump</span></div><div class="header-sub">Configurador de Estações Elevatórias — Uso Interno</div></div><div style="display:flex;align-items:center;gap:10px"><button onclick="goConfig()" style="padding:5px 12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:5px;color:white;font-size:11px;font-weight:700;cursor:pointer">⚙️ Config.</button><div class="badge-int">🔒 Interno</div></div></div>
  <div class="tab-nav" id="tabNav"></div>
  <div class="main" id="mainWrap"><div class="content" id="content"></div><div class="sidebar" id="sidebar"></div></div>

</div>

function pumpAccessoryDN(){
  const b=getBomba();if(!b)return null;
  const dn=b.saidaDN;
  if(dn<=50) return{pe:"63/DN50",peId:"PA_FE_112_50",vr:"VR_PVC63",vf:"VF_PVC63",label:"63mm (bomba DN50 → tubagem 63)"};
  if(dn===65) return{pe:"DN65",peId:"PA_FE_65",vr:"VR_FF65",vf:"VF_FF65",label:"DN65"};
  if(dn===80) return{pe:"DN80",peId:"PA_FE_80",vr:"VR_FF80",vf:"VF_FF80",label:"DN80"};
  if(dn>=100) return{pe:"DN100",peId:"PA_FE_100",vr:"VR_FF100",vf:"VF_FF100",label:"DN100"};
  return null;
}

// Custos hora fixos
const CUSTO_TEC1=16, CUSTO_TEC2=18, CUSTO_ENG=22;

const fmt=n=>n.toLocaleString("pt-PT",{style:"currency",currency:"EUR"});
const fmtN=n=>n.toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtIVA=n=>fmt(n);
function fi(arr,id){return arr.find(x=>x.id===id);}
function getSaidaPressao(b){
  // Basear na válvula de fecho selecionada — sempre uma medida acima
  const vf=S.valvFecho?fi(VALVULAS_FECHO,S.valvFecho):null;
  if(vf){
    const id=vf.id;
    // PVC roscadas — subir uma medida
    if(id==="VF_PVC50") return`2" rosca macho PVC`;        // PVC 50mm (1½") → 2"
    if(id==="VF_PVC63"||id==="VF_FF50") return`2½" rosca macho PVC`; // PVC 63mm (2") / FF DN50 → 2½"
    if(id==="VF_PVC75") return`3" rosca macho PVC`;        // PVC 75mm (2½") → 3"
    // Flangeadas normalizadas — tubo PEAD correspondente
    if(id==="VF_FF65") return`PEAD Ø75 (ponta de tubo)`;
    if(id==="VF_FF80") return`PEAD Ø90 (ponta de tubo)`;
    if(id==="VF_FF100") return`PEAD Ø110 (ponta de tubo)`;
  }
  // Fallback: DN da bomba
  if(!b) return"—";
  const dn=b.saidaDN;
  if(dn<=40) return`2" rosca macho PVC`;
  if(dn<=50) return`2½" rosca macho PVC`;
  if(dn===65) return`PEAD Ø75 (ponta de tubo)`;
  if(dn===80) return`PEAD Ø90 (ponta de tubo)`;
  if(dn>=100) return`PEAD Ø110 (ponta de tubo)`;
  return b?b.saida:"—";
}
function getCaixa(){return S.caixa!==null?CAIXAS[S.caixa]:null;}
function getHeight(){const c=getCaixa();return c&&S.height!==null?c.heights[S.height]:null;}
function getBomba(){return S.bomba?fi(BOMBAS,S.bomba):null;}
function calcVol(dn,fea){return Math.round(Math.PI*Math.pow((dn/2)/1000,2)*(fea/1000)*1000);}
function calcVolT(dn,h){return Math.round(Math.PI*Math.pow((dn/2)/1000,2)*(h/1000)*1000);}
function toggleAcc(id,cat,pvp){const i=S.acessorios.findIndex(a=>a.id===id);if(i>=0)S.acessorios.splice(i,1);else S.acessorios.push({id,qty:1,cat,pvp});render();}
function setAccQty(id,d){const a=S.acessorios.find(x=>x.id===id);if(a){a.qty=Math.max(0,a.qty+d);if(a.qty===0)S.acessorios=S.acessorios.filter(x=>x.id!==id);}render();}

// ── CAIXA DE MANOBRAS LOGIC ───────────────────────────────────
// Regras:
//   DN≤63, 2VR                → CM DN800
//   DN65-80, 2VR  ou DN65, 3VR → CM DN1000
//   DN80, 3VR  ou DN≥100       → CM DN1200
function calcCaixaManobras(){
  if(!S.caixaManobras) return null;
  const vr=S.valvRet?fi(VALVULAS_RET,S.valvRet):null;
  const vf=S.valvFecho?fi(VALVULAS_FECHO,S.valvFecho):null;
  if(!vr) return null;
  // Detect valve DN from id string
  const vrDN=vr.id.includes("50")?50:vr.id.includes("63")?63:vr.id.includes("75")?75:vr.id.includes("65")?65:vr.id.includes("80")?80:vr.id.includes("100")?100:50;
  const nVR=S.valvRetQty||2;
  const hasExtra=S.cmValvFechoExtra;
  const totalValv=nVR+(hasExtra?1:0);
  // Determine CM caixa DN
  let cmDN;
  if(vrDN>=100) cmDN=1200;
  else if(vrDN===80&&totalValv>=3) cmDN=1200;
  else if(vrDN===80&&totalValv===2) cmDN=1000;
  else if(vrDN===65&&totalValv>=3) cmDN=1000;
  else cmDN=800; // DN≤65 com 2 válvulas, ou DN≤63
  // Prices (use existing CAIXAS structure — standard H1000 as reference for CM)
  const cmPrices={800:{pvp:300,ref:"7600051210",tampa:"PE_DN800",tampaPvp:158.33,tampaRef:"7100520620"},
                  1000:{pvp:595,ref:"7600058080",tampa:"PE_DN800",tampaPvp:158.33,tampaRef:"7100520620"},
                  1200:{pvp:465,ref:"7600051280",tampa:"PE_DN800",tampaPvp:158.33,tampaRef:"7100520620"}};
  const cm=cmPrices[cmDN];
  return{cmDN,vrDN,totalValv,hasExtra,pvpCaixa:cm.pvp,refCaixa:cm.ref,pvpTampa:cm.tampaPvp,refTampa:cm.tampaRef,
    label:`Caixa de Manobras DN${cmDN}`,tampaLabel:`Tampa PE DN800 — Caixa Manobras`};
}

// ── COST CALC ─────────────────────────────────────────────────
function calcCosts(){
  let items=[];const hgt=getHeight();const cx=getCaixa();const b=getBomba();
  if(hgt)items.push({cat:"Caixa",desc:`Sandshaft ${cx.label} H=${hgt.h}mm`,ref:hgt.ref,qty:S.nCaixas,pvp:hgt.pvp,disc:0});
  if(S.tampa){const t=fi(TAMPAS,S.tampa);if(t)items.push({cat:"Tampa",desc:t.label,ref:t.ref,qty:1,pvp:t.pvp,disc:0});}
  if(S.extensao&&S.extQty>0){const e=fi(EXTENSOES,S.extensao);if(e)items.push({cat:"Extensão",desc:e.label,ref:e.ref,qty:S.extQty,pvp:e.pvp,disc:0});}
  if(b){const pDisc=["SX","SRV","GRINDER","FGR"].includes(b.series)?0:0.55;items.push({cat:"Bomba",desc:b.label,ref:b.id,qty:S.bombaQty,pvp:b.pvp,disc:pDisc});}
  if(S.peAcoplamento&&S.peQty>0){const p=fi(PES_ACOPLAMENTO,S.peAcoplamento);if(p)items.push({cat:"Pé Acopl.",desc:p.label,ref:p.ref,qty:S.peQty,pvp:p.pvp,disc:0.55});}
  if(S.valvRet&&S.valvRetQty>0){const v=fi(VALVULAS_RET,S.valvRet);if(v)items.push({cat:"V.Ret.",desc:v.label,ref:v.ref,qty:S.valvRetQty,pvp:v.pvp,disc:0.40});}
  if(S.valvFecho&&S.valvFechoQty>0){const v=fi(VALVULAS_FECHO,S.valvFecho);if(v)items.push({cat:"V.Fecho",desc:v.label,ref:v.ref,qty:S.valvFechoQty,pvp:v.pvp,disc:0.40});}
  if(S.intNivel&&S.intNivelQty>0){const n=fi(INT_NIVEL,S.intNivel);if(n)items.push({cat:"Int.Nível",desc:n.label,ref:n.ref,qty:S.intNivelQty,pvp:n.pvp,disc:0.30});}
  // Caixa de Manobras
  const cm=calcCaixaManobras();
  if(cm){
    items.push({cat:"Cx.Manobras",desc:cm.label,ref:cm.refCaixa,qty:1,pvp:cm.pvpCaixa,disc:0});
    items.push({cat:"Cx.Manobras",desc:cm.tampaLabel,ref:cm.refTampa,qty:1,pvp:cm.pvpTampa,disc:0});
    if(cm.hasExtra){const vfExtra=S.valvFecho?fi(VALVULAS_FECHO,S.valvFecho):null;if(vfExtra)items.push({cat:"Cx.Manobras",desc:`${vfExtra.label} (extra)`,ref:vfExtra.ref,qty:1,pvp:vfExtra.pvp,disc:0.40});}
  }
  S.acessorios.forEach(a=>{let src=null;[QUADROS,ARMARIOS,CESTOS,VEDANTES,ACESS_PEAD].forEach(arr=>{const f=fi(arr,a.id);if(f)src=f;});if(src)items.push({cat:a.cat||"Acess.",desc:src.label,ref:src.ref||src.id,qty:a.qty,pvp:src.pvp,disc:0.40});});
  // Custom items (sem desconto)
  S.customItems.forEach(ci=>{items.push({cat:"Especial",desc:ci.desc,ref:ci.ref||"—",qty:ci.qty,pvp:ci.pvp,disc:0});});
  items.forEach(it=>{it.net=it.pvp*(1-it.disc);it.total=it.net*it.qty;});
  const totalMat=items.reduce((s,i)=>s+i.total,0);
  // Mão de obra
  const custoTec1=S.hTec1*CUSTO_TEC1, custoTec2=S.hTec2*CUSTO_TEC2, custoEng=S.hEng*CUSTO_ENG;
  const montCusto=custoTec1+custoTec2+custoEng;
  // Transporte
  const transpCusto=S.transpKm1*TRANSPORTE.kmV1+S.transpKm2*TRANSPORTE.kmV2+S.transpAgente*TRANSPORTE.agente;
  // Margens
  const margMat=totalMat>0?totalMat*S.margemMat/(1-S.margemMat):0;
  const margMont=montCusto>0?montCusto*S.margemMont/(1-S.margemMont):0;
  const margTransp=transpCusto>0?transpCusto*S.margemTransp/(1-S.margemTransp):0;
  const pvpMat=totalMat+margMat;const pvpMont=montCusto+margMont;const pvpTransp=transpCusto+margTransp;
  const totalSemIva=pvpMat+pvpMont+pvpTransp;
  return{items,totalMat,custoTec1,custoTec2,custoEng,montCusto,transpCusto,margMat,margMont,margTransp,pvpMat,pvpMont,pvpTransp,totalSemIva};
}

function render(){
  const lastTab=6;
  document.getElementById("tabNav").innerHTML=TABS.map((t,i)=>`<div class="tab ${S.tab===i?"active":""}${i<S.tab&&i<lastTab?" done":""}" onclick="goTab(${i})"><span class="num">${i<S.tab&&i<lastTab?"✓":i+1}</span>${t}</div>`).join("");
  document.getElementById("mainWrap").className=S.tab===lastTab||S.tab===7?"main full":"main";
  const el=document.getElementById("content");
  const tabFns=[tabCaixa,tabBomba,tabInstalacao,tabAcessorios,tabMontagem,tabMargens,tabResumo,tabPrecos];
  const fn=tabFns[S.tab];if(fn)el.innerHTML=fn();
  const contentEl=document.getElementById("content");if(contentEl&&render._scrollTop){contentEl.scrollTop=0;render._scrollTop=false;}
  if(S.tab===lastTab)setTimeout(()=>drawCurve("hydro-canvas"),80);
  if(S.tab===1&&S.bomba)setTimeout(()=>drawCurve("bomba-curve"),80);
  if(S.tab<lastTab&&S.tab!==7)renderSidebar();else document.getElementById("sidebar").innerHTML="";
  document.getElementById("btnPrev").disabled=S.tab===0||S.tab===7;
  const isLastBeforeResumo=S.tab===5;
  document.getElementById("btnNext").textContent=
    S.tab===lastTab?"🖨️ Imprimir":
    S.tab===7?"← Voltar":
    isLastBeforeResumo?"✅ Finalizar":
    "Seguinte →";
  document.getElementById("btnNext").style.background=isLastBeforeResumo?"var(--navy)":"";
  document.getElementById("btnNext").style.color=isLastBeforeResumo?"white":"";
}

  setDocTitle();
  document.body.classList.add("print-cliente");

  setTimeout(()=>{document.body.classList.remove("print-cliente");restoreDocTitle();},500);
}
// Título do documento = código da proposta ao imprimir (define nome do PDF)
window.addEventListener("beforeprint",setDocTitle);
window.addEventListener("afterprint",restoreDocTitle);
function goConfig(){const prev=S.tab;S._prevTab=prev;S.tab=7;render();}
function goTab(i){render._scrollTop=true;S.tab=i;render();}
function prev(){if(S.tab===7){S.tab=S._prevTab||0;render();return;}if(S.tab>0){render._scrollTop=true;S.tab--;render();}}
function next(){
  if(S.tab===7){S.tab=S._prevTab||0;render();return;}
  if(S.tab===5){
    // FINALIZAR — valida, gera código e avança para Resumo
    const msg=validateTab(5);
    if(msg){alert("⚠️ "+msg);return;}
    if(!S.propNum) S.propNum=gerarPropNum();
    render._scrollTop=true;S.tab=6;render();return;
  }
  if(S.tab<6){
    const msg=validateTab(S.tab);
    if(msg){alert("⚠️ "+msg);return;}
    render._scrollTop=true;S.tab++;render();
  }else window.print();
}
function validateTab(t){
  if(t===0){
    if(S.caixa===null)return"Selecione uma caixa.";
    if(S.height===null)return"Selecione uma altura.";
    if(!S.tampa&&!S.tampaNA)return"Selecione uma tampa ou escolha 'Não incluir'.";
  }
  if(t===1){if(!S.bomba&&!S.bombaNA)return"Selecione uma bomba ou escolha 'Não incluir'.";}
  if(t===2){
    if(!S.peAcoplamento&&!S.peNA&&!S.semGuias)return"Selecione um pé de acoplamento ou 'Não incluir'.";
    if(!S.valvRet&&!S.valvRetNA)return"Selecione uma válvula de retenção ou 'Não incluir'.";
    if(!S.valvFecho&&!S.valvFechoNA)return"Selecione uma válvula de fecho ou 'Não incluir'.";
    if(!S.intNivel&&!S.intNivelNA)return"Selecione um interruptor de nível ou 'Não incluir'.";
  }
  if(t===3){
    const accGrps=[{ids:QUADROS.map(x=>x.id),na:"naQuadros",lbl:"Quadros Elétricos"},{ids:ARMARIOS.map(x=>x.id),na:"naArmarios",lbl:"Armário Externo"},{ids:CESTOS.map(x=>x.id),na:"naCestos",lbl:"Cestos Gradagem"},{ids:VEDANTES.map(x=>x.id),na:"naVedantes",lbl:"Vedantes / Picagens"},{ids:ACESS_PEAD.map(x=>x.id),na:"naPEAD",lbl:"Acessórios PEAD"}];
    for(const g of accGrps){const has=S.acessorios.some(a=>g.ids.includes(a.id));if(!has&&!S[g.na])return`Selecione um item em "${g.lbl}" ou escolha 'Não incluir'.`;}
  }
  return null;
}

function tabCaixa(){

  h+=`</div>`;const cx=getCaixa();
  if(cx){
    h+=`<div class="sec-title" style="font-size:13px">📏 Altura & FEA</div><div class="cgrid cg4" style="margin-bottom:14px">`;
    cx.heights.forEach((hh,i)=>{const vE=calcVol(cx.dn,hh.fea);const vT=calcVolT(cx.dn,hh.h);h+=`<div class="crd ${S.height===i?"sel":""}" onclick="S.height=${i};S.nCaixas=1;render()"><div class="crd-title" style="font-size:14px">H ${hh.h} mm</div><div class="spec"><span>FEA</span><span style="color:var(--teal)">${hh.fea} mm</span></div><div class="spec"><span>Vol. efetivo</span><span>${vE} L</span></div><div class="spec"><span>Vol. total</span><span>${vT} L</span></div><div class="spec"><span>PVP</span><span>${fmtIVA(hh.pvp)}</span></div><div style="font-size:9px;color:var(--muted);font-family:monospace">${hh.ref}</div></div>`;});
    h+=`</div>`;

    // ── Nº de Caixas (logo após escolha de altura) ──
    const hgt=getHeight();
    if(hgt){

function tabAcessorios(){
  let h=`<div class="sec-title">🧩 Acessórios</div>`;

  let recQE=null;
  const b=getBomba();
  if(b&&!S.bombaNA){

    const pAmp=b.amp;

    if(!recQE)recQE=QUADROS.filter(q=>q.fase===qFase).find(q=>pAmp<=q.ampMax);
  }

  // Kit parafusos recomendado conforme válvulas selecionadas
  let recKitPEAD=null;
  const vrSel=S.valvRet?fi(VALVULAS_RET,S.valvRet):null;
  const vfSel=S.valvFecho?fi(VALVULAS_FECHO,S.valvFecho):null;

  // ── ITENS PERSONALIZADOS (campo livre) ──
  h+=`<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:var(--navy);margin-bottom:5px;padding:3px 0;border-bottom:1px solid var(--border)">📝 Itens Personalizados</div>`;

  });
  // Add new item form
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr 80px 60px auto;gap:6px;align-items:end;margin-top:6px">`;
  h+=`<div class="field" style="margin:0"><label>Descrição</label><input id="ci_desc" placeholder="Ex: Cadeia AISI316 5m"></div>`;
  h+=`<div class="field" style="margin:0"><label>Referência</label><input id="ci_ref" placeholder="Ex: KTCADA31605"></div>`;
  h+=`<div class="field" style="margin:0"><label>Custo €</label><input id="ci_pvp" type="number" min="0" step="0.01" placeholder="0.00"></div>`;
  h+=`<div class="field" style="margin:0"><label>Qty</label><input id="ci_qty" type="number" min="1" value="1" style="width:100%"></div>`;
  h+=`<button onclick="addCustomItem()" style="padding:7px 12px;background:var(--acc);color:#0b111e;border:none;border-radius:5px;cursor:pointer;font-weight:700;font-size:12px;height:32px;margin-bottom:1px">+ Adicionar</button>`;
  h+=`</div></div>`;

  return h;
}
function addCustomItem(){
  const desc=document.getElementById("ci_desc").value.trim();
  const ref=document.getElementById("ci_ref").value.trim();
  const pvp=parseFloat(document.getElementById("ci_pvp").value)||0;
  const qty=parseInt(document.getElementById("ci_qty").value)||1;
  if(!desc){alert("Insira uma descrição.");return;}
  S.customItems.push({desc,ref,pvp,qty});
  render();
}
const ACC_GRPS=[{i:QUADROS,na:"naQuadros"},{i:ARMARIOS,na:"naArmarios"},{i:CESTOS,na:"naCestos"},{i:VEDANTES,na:"naVedantes"},{i:ACESS_PEAD,na:"naPEAD"}];
function toggleAccNA(gi){
  const g=ACC_GRPS[gi];
  S[g.na]=!S[g.na];
  if(S[g.na]){const ids=g.i.map(x=>x.id);S.acessorios=S.acessorios.filter(a=>!ids.includes(a.id));}
  render();
}

function drawCurve(canvasId){
  const cv=document.getElementById(canvasId||"hydro-canvas");if(!cv)return;const b=getBomba();if(!b)return;const hyd=HYDRO[b.id];if(!hyd)return;
  const ctx=cv.getContext("2d");const dpr=window.devicePixelRatio||1;let W=cv.offsetWidth||600;const H=200;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+"px";cv.style.height=H+"px";ctx.scale(dpr,dpr);
  const P={t:18,r:18,b:38,l:46},PW=W-P.l-P.r,PH=H-P.t-P.b;
  const maxQ=Math.max(...hyd.q)*1.1,maxH=Math.max(...hyd.h.filter(v=>v!==null))*1.15;
  const xp=q=>P.l+(q/maxQ)*PW,yp=h=>P.t+(1-h/maxH)*PH;
  ctx.fillStyle="#0a1520";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#1a2a3a";ctx.lineWidth=1;
  for(let i=0;i<=5;i++){const y=P.t+PH*i/5;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+PW,y);ctx.stroke();ctx.fillStyle="#3a5a7a";ctx.font="9px system-ui";ctx.textAlign="right";ctx.fillText((maxH*(5-i)/5).toFixed(1),P.l-5,y+3);}
  for(let i=0;i<=5;i++){const x=P.l+PW*i/5;ctx.beginPath();ctx.moveTo(x,P.t);ctx.lineTo(x,P.t+PH);ctx.stroke();ctx.fillStyle="#3a5a7a";ctx.font="9px system-ui";ctx.textAlign="center";ctx.fillText((maxQ*i/5).toFixed(1),x,P.t+PH+12);}
  ctx.strokeStyle="#4a7a9a";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(P.l,P.t);ctx.lineTo(P.l,P.t+PH);ctx.lineTo(P.l+PW,P.t+PH);ctx.stroke();
  ctx.fillStyle="#00e5a0";ctx.font="bold 9px system-ui";ctx.textAlign="center";ctx.fillText("Q [l/s]",P.l+PW/2,P.t+PH+28);ctx.save();ctx.translate(12,P.t+PH/2);ctx.rotate(-Math.PI/2);ctx.fillText("H [m]",0,0);ctx.restore();
  const pts=hyd.q.map((q,i)=>({q,h:hyd.h[i]})).filter(p=>p.h!==null);
  ctx.beginPath();ctx.moveTo(xp(pts[0].q),yp(0));pts.forEach(p=>ctx.lineTo(xp(p.q),yp(p.h)));ctx.lineTo(xp(pts[pts.length-1].q),yp(0));ctx.closePath();ctx.fillStyle="rgba(0,229,160,0.08)";ctx.fill();
  ctx.beginPath();ctx.strokeStyle="#00e5a0";ctx.lineWidth=2.5;pts.forEach((p,i)=>i===0?ctx.moveTo(xp(p.q),yp(p.h)):ctx.lineTo(xp(p.q),yp(p.h)));ctx.stroke();
  pts.forEach(p=>{ctx.beginPath();ctx.arc(xp(p.q),yp(p.h),3,0,Math.PI*2);ctx.fillStyle="#00e5a0";ctx.fill();ctx.strokeStyle="#0a1520";ctx.lineWidth=1.5;ctx.stroke();});
  const mid=Math.floor(pts.length*0.35);ctx.fillStyle="#00e5a0";ctx.font="bold 10px system-ui";ctx.textAlign="left";ctx.fillText(b.label,xp(pts[mid].q)+6,yp(pts[mid].h)-7);
}

function buildPrescricao(){
  const cx=getCaixa(),hgt=getHeight(),b=getBomba();if(!cx||!hgt)return"⚠️ Configure a estação para gerar o texto.";
  const dn=cx.dn,hh=hgt.h,fea=hgt.fea;
  const hTotal=hh*S.nCaixas;
  const feaTotal=fea*S.nCaixas;
  const volEf=calcVol(dn,feaTotal);
  const volT=calcVolT(dn,hTotal);
  const nB=cx.maxPumps;
  const pa=S.peAcoplamento?fi(PES_ACOPLAMENTO,S.peAcoplamento):null;
  const tp=S.tampa?fi(TAMPAS,S.tampa):null;
  const inst=S.semGuias?"corrente de aço inoxidável (sistema Palm)":pa?"guias de deslizamento em aço inoxidável com pé de acoplamento automático":"corrente de aço inoxidável (sistema Palm)";

  t+=`1. CAIXA / POÇO DE BOMBAGEM\nEstação elevatória em caixa pré-fabricada de ${cx.mat}, marca Hidrostation (RoPump), DN ${dn} mm (Ø ext. ${cx.outer} mm), altura total ${hTotal} mm.\nVolume total: ${volT} L. Volume efetivo (FEA): ${volEf} L. Cota FEA: ${feaTotal} mm.\n${tampaDescP}\nLigação de entrada: DN${entDNP}.\n\n`;

  } else if(b){

    t+=`  • Qmax: ${b.q} m³/h · Hmax: ${b.h} m\n  • ${b.fase} ${b.v} · Motor: ${b.motor} · Classe ${b.iso} · ${b.ip}\n  • Saída bomba: ${b.saida} · Ligação pressão: ${getSaidaPressao(b)} · Peso: ${b.peso}\n\n`;
  } else {
    t+=`2. ELECTROBOMBA(S)\nNão incluídas nesta proposta.\n\n`;
  }
  // Secção 3 — Montagem com tipo de instalação
  if(S.semGuias){
    t+=`3. MONTAGEM — INSTALAÇÃO MÓVEL\nInstalação por corrente de aço inoxidável (sistema Palm). Sem guias de deslizamento nem pé de acoplamento.\n`;
  } else {

    if(pa) t+=`Pé de acoplamento incluído: ${pa.label}.\n`;
    else if(S.peNA) t+=`Pé de acoplamento a fornecer pelo cliente.\n`;
  }
  const vr=S.valvRet?fi(VALVULAS_RET,S.valvRet):null,vf=S.valvFecho?fi(VALVULAS_FECHO,S.valvFecho):null,inl=S.intNivel?fi(INT_NIVEL,S.intNivel):null;
  t+=`\n4. ACESSÓRIOS\n`;if(vr)t+=`  • ${S.valvRetQty}× ${vr.label}\n`;if(vf)t+=`  • ${S.valvFechoQty}× ${vf.label}\n`;if(inl)t+=`  • ${S.intNivelQty}× ${inl.label}\n`;
  const cmP=calcCaixaManobras();
  if(cmP){
    t+=`\n4a. CAIXA DE MANOBRAS\nCaixa pré-fabricada PEAD DN${cmP.cmDN} com tampa PE basculante DN800 Classe A15, para alojamento das válvulas.\nEquipada com ${cmP.totalValv-(cmP.hasExtra?1:0)}× válvula de retenção DN${cmP.vrDN}${cmP.hasExtra?` e 1× válvula de fecho DN${cmP.vrDN} adicional`:``}.\n`;
  }
  // Vedantes / Picagens — separar dos restantes acessórios e gerar texto descritivo
  const vedSel=S.acessorios.filter(a=>VEDANTES.find(v=>v.id===a.id));
  const outroAcc=S.acessorios.filter(a=>!VEDANTES.find(v=>v.id===a.id));
  outroAcc.forEach(a=>{let src=null;[QUADROS,ARMARIOS,CESTOS,ACESS_PEAD].forEach(arr=>{const f=fi(arr,a.id);if(f)src=f;});if(src)t+=`  • ${a.qty}× ${src.label}\n`;});
  S.customItems.forEach(ci=>{t+=`  • ${ci.qty}× ${ci.desc}\n`;});
  if(vedSel.length&&!S.naVedantes){
    t+=`\n5. PICAGENS E VEDANTES\n`;

    const vd50=vedSel.find(a=>a.id==="VD_50");

    if(vd50) t+=`  • ${vd50.qty}× Vedante/picagem DN50 — respiro de ventilação e ligações elétricas\n`;
    if(vd110) t+=`  • ${vd110.qty}× Vedante/picagem DN110 — ligação à rede de drenagem/coletor\n`;
    outrosVed.forEach(a=>{const src=fi(VEDANTES,a.id);if(src)t+=`  • ${a.qty}× ${src.label} — ligação a coletor / tubagem\n`;});
    t+=`\n6. NORMAS\nCaixa EN 12566. Bombas CE.\n\n7. FORNECIMENTO\nInclui entrega e pré-montagem. Exclui obra civil.\n`;
  } else {
    t+=`\n5. NORMAS\nCaixa EN 12566. Bombas CE.\n\n6. FORNECIMENTO\nInclui entrega e pré-montagem. Exclui obra civil.\n`;
  }
  return t;
}

const LS_KEY="ropump_precos_v1";

// ═══════════════════════════════════════════════════════════════
// NUMERAÇÃO DE PROPOSTAS  RP-AAMM-NNN-vV
// ═══════════════════════════════════════════════════════════════
const LS_NUMSEQ="ropump_numseq_v1";

function getMesAno(){
  const d=new Date();
  const mm=String(d.getMonth()+1).padStart(2,"0");
  const yy=String(d.getFullYear()).slice(-2);
  return yy+mm;  // ex: "2603"
}

function gerarPropNum(){
  const mesAno=getMesAno();
  let seq=1;
  try{
    const raw=localStorage.getItem(LS_NUMSEQ);
    if(raw){
      const saved=JSON.parse(raw);
      if(saved.mesAno===mesAno) seq=saved.seq+1;
      // se é novo mês, reinicia em 1
    }
  }catch(e){}
  localStorage.setItem(LS_NUMSEQ,JSON.stringify({mesAno,seq}));
  return `RP-${mesAno}-${String(seq).padStart(3,"0")}`;
}

function getCodigo(){
  if(!S.propNum)return"(por finalizar)";
  return `${S.propNum}-v${S.propVer}`;
}

function setDocTitle(){
  // Muda o título da página — ao imprimir para PDF, o browser usa o título como nome do ficheiro
  const cx=getCaixa();
  const cxLabel=cx?cx.label:"EE";
  document.title=`${getCodigo()} ${cxLabel}${S.obra?" "+S.obra:""}`;
}

function restoreDocTitle(){
  document.title="RoPump – Configurador Interno";
}

function buildPriceRegistry(){
  const reg=[];
  // Caixas
  CAIXAS.forEach(cx=>cx.heights.forEach(hh=>{reg.push({cat:"Caixa",id:`CX_${cx.id}_${hh.h}`,desc:`Sandshaft ${cx.label} H${hh.h}mm`,ref:hh.ref,pvp:hh.pvp,_target:hh});}));
  // Tampas
  TAMPAS.forEach(t=>reg.push({cat:"Tampa",id:t.id,desc:t.label,ref:t.ref,pvp:t.pvp,_target:t}));
  // Extensões
  EXTENSOES.forEach(e=>reg.push({cat:"Extensão",id:e.id,desc:e.label,ref:e.ref,pvp:e.pvp,_target:e}));
  // Bombas (só as com PVP > 0 ou todas)
  BOMBAS.forEach(b=>reg.push({cat:"Bomba",id:b.id,desc:b.label,ref:b.id,pvp:b.pvp,_target:b}));
  // Pés acoplamento
  PES_ACOPLAMENTO.forEach(p=>reg.push({cat:"Pé Acoplam.",id:p.id,desc:p.label,ref:p.ref,pvp:p.pvp,_target:p}));
  // Válvulas retenção
  VALVULAS_RET.forEach(v=>reg.push({cat:"V.Retenção",id:v.id,desc:v.label,ref:v.ref,pvp:v.pvp,_target:v}));
  // Válvulas fecho
  VALVULAS_FECHO.forEach(v=>reg.push({cat:"V.Fecho",id:v.id,desc:v.label,ref:v.ref,pvp:v.pvp,_target:v}));
  // Interruptores nível
  INT_NIVEL.forEach(n=>reg.push({cat:"Int.Nível",id:n.id,desc:n.label,ref:n.ref,pvp:n.pvp,_target:n}));
  // Quadros
  QUADROS.forEach(q=>reg.push({cat:"Quadro",id:q.id,desc:q.label,ref:q.ref,pvp:q.pvp,_target:q}));
  // Armários
  ARMARIOS.forEach(a=>reg.push({cat:"Armário",id:a.id,desc:a.label,ref:a.ref,pvp:a.pvp,_target:a}));
  // Cestos
  CESTOS.forEach(c=>reg.push({cat:"Cesto",id:c.id,desc:c.label,ref:c.ref,pvp:c.pvp,_target:c}));
  // Vedantes
  VEDANTES.forEach(v=>reg.push({cat:"Vedante",id:v.id,desc:v.label,ref:v.ref,pvp:v.pvp,_target:v}));
  // PEAD
  ACESS_PEAD.forEach(a=>reg.push({cat:"PEAD",id:a.id,desc:a.label,ref:a.ref,pvp:a.pvp,_target:a}));
  return reg;
}

function loadSavedPrices(){
  try{const raw=localStorage.getItem(LS_KEY);if(!raw)return null;return JSON.parse(raw);}catch(e){return null;}
}

function applyPrices(saved){
  if(!saved)return;
  const reg=buildPriceRegistry();
  reg.forEach(item=>{
    if(saved[item.id]!==undefined){item._target.pvp=parseFloat(saved[item.id]);}
  });
}

function savePricesToLS(updates){
  const existing=loadSavedPrices()||{};
  Object.assign(existing,updates);
  existing._savedAt=new Date().toISOString();
  localStorage.setItem(LS_KEY,JSON.stringify(existing));
}

function exportCSV(){
  const reg=buildPriceRegistry();
  const rows=[["id","categoria","descricao","referencia","pvp_atual"]];
  reg.forEach(r=>rows.push([r.id,r.cat,`"${r.desc.replace(/"/g,'""')}"`,r.ref,r.pvp.toFixed(2)]));
  const csv=rows.map(r=>r.join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="ropump_precos.csv";a.click();URL.revokeObjectURL(url);
}

function importCSV(file){
  const reader=new FileReader();
  reader.onload=function(e){
    const lines=e.target.result.replace(/^\uFEFF/,"").split("\n");
    const updates={};let ok=0;let errs=[];
    lines.slice(1).forEach((line,li)=>{
      if(!line.trim())return;
      const cols=line.split(";");
      if(cols.length<5){errs.push(`Linha ${li+2}: colunas insuficientes`);return;}
      const id=cols[0].trim();const pvp=parseFloat(cols[4].replace(",","."));
      if(!id||isNaN(pvp)){errs.push(`Linha ${li+2}: id ou pvp inválido`);return;}
      updates[id]=pvp;ok++;
    });
    if(errs.length>0)alert(`⚠️ ${errs.length} erro(s):\n${errs.slice(0,5).join("\n")}${errs.length>5?"\n...":""}`);
    if(ok>0){
      savePricesToLS(updates);
      applyPrices(loadSavedPrices());
      alert(`✅ ${ok} preços actualizados com sucesso.`);
      render();
    }
  };
  reader.readAsText(file,"UTF-8");
}

// ── Apply saved prices on load ──
applyPrices(loadSavedPrices());

// ═══════════════════════════════════════════════════════════════
// TAB 7: PREÇOS
// ═══════════════════════════════════════════════════════════════
function tabPrecos(){
  const saved=loadSavedPrices()||{};
  const savedAt=saved._savedAt?new Date(saved._savedAt).toLocaleString("pt-PT"):"nunca";
  const reg=buildPriceRegistry();
  const cats=[...new Set(reg.map(r=>r.cat))];

  let h=`<div class="sec-title">💰 Gestão de Preços</div>`;
  h+=`<div class="sec-sub">Edite os preços e guarde. Use CSV para backup ou para transferir entre computadores.</div>`;

  // Toolbar
  h+=`<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center">`;
  h+=`<button class="btn btn-next" style="font-size:11px;padding:7px 14px" onclick="exportCSV()">⬇ Exportar CSV</button>`;
  h+=`<label style="cursor:pointer"><input type="file" accept=".csv" style="display:none" onchange="importCSV(this.files[0]);this.value=''"><span class="btn btn-prev" style="font-size:11px;padding:7px 14px;display:inline-block">⬆ Importar CSV</span></label>`;
  h+=`<span style="font-size:10px;color:var(--muted);margin-left:6px">Último guardado: ${savedAt}</span>`;
  h+=`</div>`;

  // Filter pills
  h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">`;
  h+=`<span style="font-size:11px;padding:3px 10px;border-radius:20px;cursor:pointer;border:1.5px solid var(--acc);color:var(--teal);background:rgba(0,181,200,.06)" onclick="document.querySelectorAll('.pm-cat').forEach(x=>x.style.display='')">Todos</span>`;
  cats.forEach(cat=>{h+=`<span style="font-size:11px;padding:3px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--border);color:var(--muted)" onclick="document.querySelectorAll('.pm-cat').forEach(x=>x.style.display=x.dataset.cat==='${cat}'?'':'none')">${cat}</span>`;});
  h+=`</div>`;

  // Table
  h+=`<div style="overflow-x:auto"><table class="cost-tbl" style="font-size:11px">`;
  h+=`<thead><tr><th style="width:30%">Descrição</th><th>Referência</th><th>Categoria</th><th style="text-align:right">PVP actual</th><th style="text-align:right;width:130px">Novo PVP (€)</th></tr></thead><tbody>`;

  reg.forEach(item=>{
    const isChanged=saved[item.id]!==undefined&&parseFloat(saved[item.id]).toFixed(2)!==item.pvp.toFixed(2);
    h+=`<tr class="pm-cat" data-cat="${item.cat}" style="${isChanged?"background:rgba(255,165,2,.05)":""}">`;
    h+=`<td>${item.desc}</td>`;
    h+=`<td style="font-family:monospace;font-size:10px;color:var(--muted)">${item.ref}</td>`;
    h+=`<td style="font-size:10px;color:var(--muted)">${item.cat}</td>`;
    h+=`<td style="text-align:right;color:${isChanged?"var(--warn)":"var(--text)"}">${item.pvp.toFixed(2)} €</td>`;
    h+=`<td style="text-align:right"><input type="number" step="0.01" min="0" value="${item.pvp.toFixed(2)}" data-id="${item.id}" style="width:110px;padding:3px 6px;background:var(--card2);border:1px solid var(--border);border-radius:4px;color:var(--navy);font-size:11px;text-align:right" oninput="this.style.borderColor='var(--warn)'"></td>`;
    h+=`</tr>`;
  });

  h+=`</tbody></table></div>`;

  // Save button
  h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">`;
  h+=`<span style="font-size:10px;color:var(--muted)">${reg.length} referências · preços guardados em localStorage (este browser)</span>`;
  h+=`<div style="display:flex;gap:8px">`;
  h+=`<button class="btn btn-prev" style="font-size:11px" onclick="if(confirm('Repor todos os preços originais?')){localStorage.removeItem('${LS_KEY}');location.reload()}">↺ Repor originais</button>`;
  h+=`<button class="btn btn-next" style="font-size:11px;padding:8px 18px" onclick="
    const inputs=document.querySelectorAll('[data-id]');
    const updates={};
    inputs.forEach(inp=>{const v=parseFloat(inp.value);if(!isNaN(v))updates[inp.dataset.id]=v;});
    savePricesToLS(updates);
    applyPrices(loadSavedPrices());
    inputs.forEach(inp=>inp.style.borderColor='var(--acc)');
    setTimeout(()=>render(),800);
  ">💾 Guardar preços</button>`;
  h+=`</div></div>`;

  return h;
}

function refazerCotacao(){
  S.propVer=(S.propVer||1)+1;  // incrementa versão, mantém número base
  S.tab=0;render();
}

function renderSidebar(){
  const el=document.getElementById("sidebar");const c=calcCosts();const cx=getCaixa();const hgt=getHeight();const b=getBomba();
  let h=`<div class="sb-label">Configuração</div>`;
  if(cx){h+=`<div class="sb-item"><span>Caixa</span><span>${cx.label}${S.nCaixas>1?` ×${S.nCaixas}`:""}</span></div>`;if(hgt){const hTot=hgt.h*S.nCaixas;const feaTot=hgt.fea*S.nCaixas;h+=`<div class="sb-item"><span>Altura total</span><span>H ${hTot}mm${S.nCaixas>1?` (${S.nCaixas}×${hgt.h})`:""}</span></div>`;h+=`<div class="sb-item"><span>FEA total</span><span>${feaTot}mm</span></div>`;h+=`<div class="sb-item"><span>Vol.ef.</span><span>${calcVol(cx.dn,feaTot)} L</span></div>`;}}  
  if(b){h+=`<div class="sb-item"><span>Bomba</span><span style="font-size:9px">${b.kw}kW ${b.series}</span></div>`;h+=`<div class="sb-item"><span>Qty</span><span>${S.bombaQty}×</span></div>`;}
  h+=`<hr class="sb-divider"><div class="sb-label">Custos internos</div>`;
  h+=`<div class="sb-item"><span>Material</span><span>${fmt(c.totalMat)}</span></div>`;
  h+=`<div class="sb-item"><span>M.Obra</span><span>${fmt(c.montCusto)}</span></div>`;
  h+=`<div class="sb-item"><span>Transporte</span><span>${fmt(c.transpCusto)}</span></div>`;
  h+=`<hr class="sb-divider"><div class="sb-label">PVP (c/ margem)</div>`;
  h+=`<div class="sb-item"><span>Material ${(S.margemMat*100).toFixed(0)}%</span><span>${fmt(c.pvpMat)}</span></div>`;
  h+=`<div class="sb-item"><span>M.Obra ${(S.margemMont*100).toFixed(0)}%</span><span>${fmt(c.pvpMont)}</span></div>`;
  h+=`<div class="sb-item"><span>Transp. ${(S.margemTransp*100).toFixed(0)}%</span><span>${fmt(c.pvpTransp)}</span></div>`;
  h+=`<div class="sb-total"><div class="lbl">Total</div><div class="val">${fmt(c.totalSemIva)}</div></div>`;
  el.innerHTML=h;
}

render();
window.addEventListener("resize",()=>{if(S.tab===TABS.length-1)setTimeout(()=>drawCurve("hydro-canvas"),50);if(S.tab===1&&S.bomba)setTimeout(()=>drawCurve("bomba-curve"),50);});
</script>
